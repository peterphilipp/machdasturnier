version: '3.8'
services:
  app:
    image: ghcr.io/peterphilipp/machdasturnier:latest
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "file:./prisma/data/dev.db"

      FRONTEND_URL: "https://machdasturnier.mygate.dedyn.io"

      # --- Kennzeichnung der Testumgebung ---------------------------------
      # NUR auf dem Testhost setzen, hier bewusst auskommentiert.
      #
      # Ohne APP_ENV verhaelt sich alles wie bisher. Mit "test" zeigt die App
      # ein gestreiftes Band am oberen Rand und - solange niemand angemeldet
      # ist - einen blockierenden Hinweis mit Knopf zur echten App.
      #
      # Anlass: Ein Helfer bekam den Link zur Testumgebung geschickt, sah eine
      # Anmeldemaske, die von der echten nicht zu unterscheiden war, und
      # probierte dort vergeblich sein richtiges Passwort - bis zur Sperre.
      #
      # PRODUCTION_URL ist das Ziel des "Zur echten App"-Knopfes. Fehlt sie,
      # bleibt der Hinweis stehen, aber ohne Absprung.
      # APP_ENV: "test"
      # PRODUCTION_URL: "https://machdasturnier.mygate.dedyn.io"

      # Pflicht: JWT-Secret aus der Host-Umgebung (kein Default im Code!).
      # `docker compose up` bricht mit klarer Meldung ab, wenn nicht gesetzt.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET muss gesetzt sein (z.B. via .env oder Shell-Env)}"
      # Optional: E-Mail-Versand (Passwort-Reset). RESEND_API_KEY NIE hier als
      # Literal eintragen - nur über eine echte Env-Var/.env-Datei am Host
      # setzen, sonst landet der Schluessel im naechsten Commit. EMAIL_FROM
      # muss bei Resend als Absender verifiziert sein.
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-Mach das Turnier! <noreply@mygate.dedyn.io>}"
      ADMIN_EMAILS: "${ADMIN_EMAILS:-}"
      # Optional: Web-Push (VAPID). Ohne beide Schlüssel bleibt Push deaktiviert
      # (kein Fehler, nur eine Log-Warnung). Erzeugen mit:
      # npx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_MAILTO: "${VAPID_MAILTO:-mailto:noreply@mygate.dedyn.io}"
    volumes:
      - db-data:/app/prisma/data

volumes:
  db-data:
