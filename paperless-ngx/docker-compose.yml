services:
  broker:
    image: docker.io/library/redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data

  db:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless

  ollama:
    image: docker.io/ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - db
      - broker
      - ollama
    ports:
      - "8001:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - export:/usr/src/paperless/export
      - consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: admin123
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPORT: 5432
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_URL: http://localhost:8001
      # KI-Optionen
      PAPERLESS_OCR_LANGUAGES: deu eng
      PAPERLESS_OCR_MODE: skip
      PAPERLESS_TASK_USER: paperless
      PAPERLESS_CONSUMER_POLLING: 60
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: true
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: false
      # Secret Key für sichere Session-Verwaltung
      PAPERLESS_SECRET_KEY: "machdasturnier-paperless-ngx-secret-key-2026-local-dev"
      # KI aktivieren
      PAPERLESS_AI_ENABLED: YES
      # LLM Backend (ollama oder openai)
      PAPERLESS_AI_LLM_BACKEND: ollama
      # Modell für Metadata Extraction
      PAPERLESS_AI_LLM_MODEL: llama3.2
      # Embedding Backend
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: ollama
      # Embedding Modell (für Vektorsuche)
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: nomic-embed-text
      # Endpoint für Ollama (host.docker.internal = Host-Maschine aus Container)
      PAPERLESS_AI_LLM_ENDPOINT: http://ollama:11434
      PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT: http://ollama:11434
      # Ausgabe-Sprache für KI-Extraktion
      PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: de

volumes:
  redis_data:
  pg_data:
  data:
  media:
  export:
  consume:
  ollama_data:
